<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <title>Live % Converter • Mobile | Crossover</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="paper-brief.css">
  <style>
    :root { --accent: #7aa2f7; --bull: #3dd68c; --bear: #f07178; --panel: #171a1f; --bg: #0f1114; --text: #e8eaed; --border: #2a3038; }
    body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; padding: 12px; }
    .trading-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
    .section-card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
    .metric-label { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: #9aa0a6; margin-bottom: 6px; }
    input { width: 100%; background: #0f1114; border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; font-size: 1.25rem; color: white; text-align: center; }
    .increment-group { display: flex; gap: 4px; margin-top: 6px; }
    .inc-btn { flex: 1; padding: 10px; background: #1a1e24; border: 1px solid var(--border); border-radius: 10px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="max-w-lg mx-auto">
    <div class="flex justify-between items-center mb-5">
      <div class="text-xl font-semibold">Live % Converter</div>
      <a href="./" class="text-sm text-[#7aa2f7]">← Flip Board</a>
    </div>

    <!-- Portfolio -->
    <div class="section-card">
      <div class="metric-label">PORTFOLIO VALUE (USD)</div>
      <input id="holdingsInput" type="number" value="25000" oninput="recalculate()">
      <div class="increment-group">
        <button onclick="adjustHoldings(100)" class="inc-btn">+100</button>
        <button onclick="adjustHoldings(500)" class="inc-btn">+500</button>
        <button onclick="adjustHoldings(1000)" class="inc-btn">+1k</button>
        <button onclick="adjustHoldings(-100)" class="inc-btn">-100</button>
        <button onclick="adjustHoldings(-500)" class="inc-btn">-500</button>
      </div>
    </div>

    <!-- Price -->
    <div class="section-card">
      <div class="metric-label">COIN SYMBOL</div>
      <input id="symbolInput" value="SOL" style="font-size:1.25rem">
      <button onclick="refreshPrice()" class="mt-3 w-full bg-[#7aa2f7] text-black py-3.5 font-semibold rounded-2xl">LOAD LIVE PRICE</button>
      <div id="priceDisplay" class="mt-5 text-4xl font-semibold trading-mono text-center">—</div>
    </div>

    <!-- Converter -->
    <div class="section-card">
      <div class="metric-label">% OF PORTFOLIO</div>
      <input id="pctInput" type="number" step="0.1" value="2.5" oninput="recalculate()">
      <div class="increment-group">
        <button onclick="adjustPct(-0.5)" class="inc-btn">-0.5%</button>
        <button onclick="adjustPct(0.5)" class="inc-btn">+0.5%</button>
        <button onclick="adjustPct(1)" class="inc-btn">+1%</button>
        <button onclick="adjustPct(2)" class="inc-btn">+2%</button>
      </div>

      <div class="metric-label mt-5">USD AMOUNT</div>
      <input id="usdInput" type="number" oninput="recalculate()">
      <div class="increment-group">
        <button onclick="adjustUsd(-100)" class="inc-btn">-100</button>
        <button onclick="adjustUsd(100)" class="inc-btn">+100</button>
        <button onclick="adjustUsd(500)" class="inc-btn">+500</button>
      </div>

      <div class="metric-label mt-5">COIN QUANTITY</div>
      <input id="qtyInput" type="number" oninput="recalculate()">
    </div>

    <!-- Trade -->
    <div class="section-card">
      <button onclick="copyQty()" class="w-full py-4 bg-[#171a1f] border border-[#2a3038] mb-3 rounded-2xl">COPY COIN QUANTITY</button>
      <button onclick="copyUsd()" class="w-full py-4 bg-[#171a1f] border border-[#2a3038] rounded-2xl">COPY USD AMOUNT</button>
    </div>
  </div>

<script>
let currentPrice = 0;
let currentSymbol = "SOL";

function recalculate() {
  const holdings = parseFloat(document.getElementById('holdingsInput').value) || 0;
  const pct = parseFloat(document.getElementById('pctInput').value) || 0;
  if (currentPrice > 0) {
    const usd = holdings * (pct / 100);
    const qty = usd / currentPrice;
    document.getElementById('usdInput').value = usd.toFixed(2);
    document.getElementById('qtyInput').value = qty.toFixed(6);
  }
}

async function refreshPrice() {
  let sym = document.getElementById('symbolInput').value.trim().toUpperCase() || 'SOL';
  currentSymbol = sym;
  let id = sym.toLowerCase();
  const map = {'BTC':'bitcoin','ETH':'ethereum','SOL':'solana','XRP':'ripple','DOGE':'dogecoin','PEPE':'pepe','AVAX':'avalanche-2'};
  if (map[sym]) id = map[sym];
  try {
    const res = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${id}&vs_currencies=usd`);
    const data = await res.json();
    currentPrice = data[id].usd;
    document.getElementById('priceDisplay').innerHTML = '$' + currentPrice.toLocaleString();
    recalculate();
  } catch(e) { document.getElementById('priceDisplay').innerHTML = 'ERROR'; }
}

function adjustHoldings(delta) { 
  let val = parseFloat(document.getElementById('holdingsInput').value) || 0;
  document.getElementById('holdingsInput').value = Math.max(0, val + delta);
  recalculate();
}

function adjustPct(delta) {
  let val = parseFloat(document.getElementById('pctInput').value) || 0;
  document.getElementById('pctInput').value = (val + delta).toFixed(1);
  recalculate();
}

function adjustUsd(delta) {
  let val = parseFloat(document.getElementById('usdInput').value) || 0;
  document.getElementById('usdInput').value = (val + delta).toFixed(2);
  recalculate();
}

function copyQty() {
  const qty = document.getElementById('qtyInput').value;
  navigator.clipboard.writeText(qty + ' ' + currentSymbol);
}

function copyUsd() {
  const usd = document.getElementById('usdInput').value;
  navigator.clipboard.writeText(usd);
}

// Init
document.getElementById('holdingsInput').value = localStorage.getItem('holdings') || 25000;
setTimeout(() => { refreshPrice(); recalculate(); }, 300);
</script>
</body>
</html>
